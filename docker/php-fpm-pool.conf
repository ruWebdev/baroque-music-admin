; Продакшен-пул php-fpm для слабого сервера (1 vCPU / 2 ГБ).
; Сокет не нужен: nginx в этом же контейнере ходит на 127.0.0.1:9000.

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 4
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500

pm.status_path = /fpm-status
ping.path = /fpm-ping
